parent_config: .swiftlint.yml

# Temporary CI debt carve-out for existing violations.
# Re-enable one rule at a time as each rule's current violations are cleaned up.
disabled_rules:
  - cyclomatic_complexity
  - file_length
  - function_body_length
  - identifier_name
  - large_tuple
  - optional_data_string_conversion
  - static_over_final_class
  - trailing_comma
  - unneeded_synthesized_initializer
